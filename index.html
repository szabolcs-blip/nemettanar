<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lena</title>
  <meta name="application-name" content="Lena">
  <meta name="apple-mobile-web-app-title" content="Lena">
  <meta name="description" content="Német gyakorlás Lenával, hangon és írásban.">
  <meta name="theme-color" content="#14161c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="app">
    <header class="top">
      <button id="notes-open" class="chip notes-open">Jegyzetek</button>
      <h1>Lena</h1>
      <p class="sub">a némettanárod</p>
    </header>

    <div class="stage">
      <canvas id="orb" aria-hidden="true"></canvas>
    </div>

    <p id="status" class="status" role="status">Nyomd meg a gombot, és kezdjetek beszélgetni.</p>

    <div id="speed" class="speed" role="group" aria-label="Lena tempója">
      <button data-speed="0.7">Nagyon lassú</button>
      <button data-speed="0.8">Lassú</button>
      <button data-speed="0.95">Normál</button>
    </div>

    <div class="controls">
      <button id="start" class="primary">Beszélgetés indítása</button>
      <button id="mute" class="secondary" hidden>Némítás</button>
    </div>

    <div class="workspace">
      <section id="board" class="board" hidden aria-labelledby="board-title">
        <div class="board-head">
          <h2 id="board-title"></h2>
          <button id="board-toggle" class="chip" aria-expanded="true">Kicsinyítés</button>
          <button id="board-close" class="close small" aria-label="Tábla letörlése">×</button>
        </div>
        <div id="board-body" class="rich board-body"></div>
      </section>
      <section id="transcript" class="transcript" aria-label="Felirat" aria-live="polite"></section>
    </div>
    <button id="jump" class="jump" hidden aria-label="Ugrás a legújabb üzenetre">↓ Legújabb</button>
    <p id="version" class="version"></p>
  </main>

  <section id="notes" class="panel" hidden aria-labelledby="notes-title">
    <div class="panel-head">
      <h2 id="notes-title">Jegyzetek</h2>
      <button id="notes-close" class="close" aria-label="Bezárás">×</button>
    </div>
    <div class="panel-body">
      <p class="hint">Lena az utolsó 3 jegyzetet kapja meg minden beszélgetés elején.</p>
      <div id="notes-list"></div>
      <button id="notes-clear" class="secondary danger" hidden>Összes törlése</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js?v=8"></script>
</body>
</html>
